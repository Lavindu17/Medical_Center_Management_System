name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-password
      # The integration suite creates and drops its own sethro_medical_test schema; it refuses any other name.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Some packages declare conflicting peer ranges (React 19); the project is installed with this flag locally too.
      - run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (security matrix, ownership, helpers)
        run: npm test

      - name: Integration tests (real MySQL)
        run: npm run test:integration
